services:
  worker:
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
    container_name: dayz-bot-worker
    restart: unless-stopped
    environment:
      - WORKER_ID=worker-node-docker-01
      - WORKER_NAME=Worker Docker Node
      - WORKER_SECRET_KEY=${WORKER_SECRET_KEY:-dayz-worker-secret-token-change-in-prod}
      - ADMIN_API_URL=${ADMIN_API_URL:-http://127.0.0.1:8788}
      - POLL_INTERVAL_SECS=20
      - RUST_LOG=info
    network_mode: host
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
