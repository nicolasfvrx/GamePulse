name: Release Rust Worker

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Worker Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: gamepulse-worker
            artifact_name: gamepulse-worker-linux-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: gamepulse-worker.exe
            artifact_name: gamepulse-worker-windows-x86_64.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }} --manifest-path apps/worker/Cargo.toml

      - name: Package Linux Binary (tar.gz)
        if: runner.os == 'Linux'
        run: |
          cd apps/worker/target/${{ matrix.target }}/release
          tar -czf ../../../../../${{ matrix.artifact_name }} ${{ matrix.binary_name }}

      - name: Package Windows Binary (zip)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Compress-Archive -Path "apps/worker/target/${{ matrix.target }}/release/${{ matrix.binary_name }}" -DestinationPath "${{ matrix.artifact_name }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
