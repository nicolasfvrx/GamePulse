name: Deploy Admin to Cloudflare Pages

on:
  push:
    branches: [master]
    paths:
      - 'apps/admin/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy-admin.yml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.npmrc'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudflare Pages & D1 (Zero-Touch)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Shared Package
        run: pnpm --filter @gamepulse/shared run build

      - name: Build Admin Dashboard
        run: pnpm --filter @gamepulse/admin run build

      - name: Zero-Touch Cloudflare Pages & D1 Auto-Deploy
        run: pnpm --filter @gamepulse/admin run deploy:auto
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
