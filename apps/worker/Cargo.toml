[package]
name = "dayz-worker"
version = "1.0.0"
edition = "2021"
authors = ["Nicolas"]
description = "High-performance DayZ Discord Presence Worker Daemon with Steam A2S Query & Cloudflare sync"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.33"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
dotenvy = "0.15"
anyhow = "1.0"
thiserror = "2.0"
byteorder = "1.5"
url = "2.5"

[dev-dependencies]
tokio-test = "0.4"
