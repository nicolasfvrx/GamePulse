name = "gamepulse-admin"
compatibility_date = "2024-09-23"
pages_build_output_dir = "dist"

[vars]
WORKER_SECRET_KEY = "gamepulse-worker-secret-token-change-in-prod"
ADMIN_SECRET_KEY = "gamepulse-admin-secret-change-in-prod"

[[d1_databases]]
binding = "DB"
database_name = "gamepulse-db"
database_id = "gamepulse-db-id"
migrations_dir = "migrations"
